<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoftChat — Vista previa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: #080808; font-family: "Nunito Sans", Arial, sans-serif; }
    .page { display: flex; min-height: 100vh; background: #fff; }
    .hero { width: 51.7%; height: 100vh; position: sticky; top: 0; flex: 0 0 51.7%; padding: 0; }
    .hero img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .right { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 28px clamp(24px,4vw,80px); }
    .brand { align-self: flex-end; display: flex; align-items: center; gap: 8px; height: 38px; font-size: 20px; font-weight: 700; letter-spacing: -.04em; }
    .brand img { width: 39px; height: 35px; object-fit: contain; }
    main { width: 100%; max-width: 495px; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 0; }
    h1 { font-size: clamp(26px,2.2vw,30px); line-height: 1.25; letter-spacing: -.04em; font-weight: 600; margin: 0; }
    .subtitle { color: #a7a7a7; margin: 4px 0 0; font-size: 14px; letter-spacing: -.04em; }
    .switch { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #e7e7e7; border-radius: 20px; padding: 6px; margin-top: clamp(20px,4vh,36px); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .switch button { height: 54px; border: 0 solid transparent; background: transparent; border-radius: 20px; font-size: 14px; font-weight: 500; letter-spacing: -.03em; transition: background-color .15s; }
    .switch button:not(.active):hover { background: rgba(0,0,0,.05); }
    .switch button.active { border: 1px solid #e7e7e7; background: #cdcdcd; }
    form { margin-top: clamp(24px,5vh,53px); }
    label.title { display: block; margin: 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: -.03em; }
    .field-wrap { position: relative; }
    .field { width: 100%; height: 62px; border: 1px solid #e7e7e7; border-radius: 20px; padding: 0 54px 0 27px; color: #111; outline: none; font-size: 14px; font-weight: 600; letter-spacing: -.03em; transition: border-color .15s; }
    .field::placeholder { color: #a7a7a7; font-size: 14px; font-weight: 500; opacity: 1; }
    .field:focus { border-color: #777; }
    .email-check { position: absolute; right: 27px; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(49,17,29,.1); color: #fff; font-size: 12px; font-weight: 800; }
    .email-check.valid { background: #22c55e; }
    .password-label { margin-top: clamp(18px,3.6vh,35px) !important; }
    .toggle-eye { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); padding: 4px; border: 0; background: none; color: #111; display: grid; place-items: center; }
    .toggle-eye svg { display: block; }
    .toggle-eye .eye-slash { transform: scaleX(0); transform-origin: center; opacity: 0; transition: transform .2s ease, opacity .16s ease; }
    .toggle-eye.is-visible .eye-slash { transform: scaleX(1); opacity: 1; }
    .toggle-eye.eye-animating svg { animation: eye-blink .38s ease-in-out; }
    @keyframes eye-blink { 0% { transform: scaleY(1); } 36% { transform: scaleY(.08); } 72% { transform: scaleY(1.12); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .toggle-eye svg, .toggle-eye .eye-slash { animation: none !important; transition: none; } }
    .options { margin-top: clamp(18px,3.6vh,45px); padding: 0 9px; display: flex; flex-wrap: wrap; gap: 11px; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; letter-spacing: -.03em; }
    .remember { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .remember input { position: absolute; opacity: 0; }
    .check-box { width: 18px; height: 18px; border-radius: 6px; background: rgba(232,232,232,.5); display: grid; place-items: center; color: transparent; transition: .15s; }
    .remember input:checked + .check-box { background: #080808; color: #fff; }
    .text-button { border: 0; padding: 0; background: transparent; color: inherit; text-decoration: underline; font-size: inherit; font-weight: inherit; }
    .message { margin: 12px 0 0; min-height: 16px; text-align: center; font-size: 13px; }
    .message.error { color: #dc2626; }
    .message.info { color: #15803d; }
    .submit { display: block; width: 100%; max-width: 354px; height: 64px; margin: clamp(18px,3.6vh,27px) auto 0; border: 0; border-radius: 20px; background: #cdcdcd; color: #0b0b0b; font-size: 14px; font-weight: 600; letter-spacing: -.03em; transition: background-color .15s, color .15s; }
    .submit.ready { background: #080808; color: #fff; }
    .submit.ready:hover { background: rgba(0,0,0,.85); }
    .submit:not(.ready):hover { background: #c2c2c2; }
    .divider { margin-top: clamp(18px,3.6vh,36px); display: flex; justify-content: center; align-items: center; gap: 11px; color: #cecece; font-size: 13px; font-weight: 500; letter-spacing: -.03em; white-space: nowrap; }
    .divider span { height: 1px; width: min(22%,111px); background: #f1f1f1; }
    .qr { display: flex; justify-content: center; align-items: center; gap: 11px; width: 100%; max-width: 381px; height: 45px; margin: 18px auto 0; border: 1px solid #e7e7e7; border-radius: 20px; background: #fff; font-size: 14px; font-weight: 500; letter-spacing: -.03em; transition: background-color .15s; }
    .qr:hover { background: rgba(0,0,0,.05); }
    .switch, .switch button, .field, .submit, .qr { border-radius: 20px !important; }
    .terms { max-width: 315px; margin: auto auto 0; padding-top: clamp(22px,4.5vh,54px); color: #a7a7a7; text-align: center; font-size: 13px; font-weight: 500; line-height: 1.43; }
    .terms a { color: #080808; text-decoration: underline; }
    @media (max-width: 760px) {
      .page { display: block; }
      .hero { width: 100%; height: 40vh; min-height: 220px; position: relative; }
      .right { padding: 24px 28px 32px; }
      .brand { margin-bottom: 8px; }
      main { max-width: 551px; padding: 16px 0 24px; }
      .terms { padding-top: 28px; }
    }
    @media (max-height: 700px) and (min-width: 761px) {
      .right { padding-top: 18px; padding-bottom: 18px; }
      main { padding-top: 12px; padding-bottom: 12px; }
      .field { height: 58px; }
      .switch button { height: 50px; }
      .options { margin-top: 18px; }
      .submit { height: 58px; margin-top: 18px; }
      .divider { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero"><img src="softchat-hero.gif" alt="Imagen de portada animada de SoftChat"></div>
    <section class="right">
      <div class="brand"><img src="softchat-logo.png" alt=""><span>SoftChat</span></div>
      <main>
        <h1 id="heading">Bienvenido de nuevo!</h1>
        <p class="subtitle">Por favor ingresa tus datos</p>
        <div class="switch" role="tablist" aria-label="Tipo de acceso">
          <button class="active" id="loginTab" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
          <button id="registerTab" type="button" role="tab" aria-selected="false">Registrarse</button>
        </div>
        <form id="loginForm" novalidate>
          <label class="title" for="email">Usuario</label>
          <div class="field-wrap">
            <input class="field" id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
            <span class="email-check" id="emailCheck" aria-hidden="true">✓</span>
          </div>
          <label class="title password-label" for="password">Contraseña</label>
          <div class="field-wrap">
            <input class="field" id="password" type="password" autocomplete="current-password" placeholder="••••••••">
            <button class="toggle-eye" id="togglePassword" type="button" aria-label="Mostrar contraseña">
              <svg id="eyeIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3 21 21"/></svg>
            </button>
          </div>
          <div class="options">
            <label class="remember"><input id="remember" type="checkbox"><span class="check-box">✓</span><span>Recordar datos</span></label>
            <button class="text-button" id="recover" type="button">Recuperar contraseña</button>
          </div>
          <p class="message" id="message" role="status"></p>
          <button class="submit" id="submitButton" type="submit">Ingresar</button>
        </form>
        <div class="divider"><span></span>O continúa con<span></span></div>
        <button class="qr" id="qrButton" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v2M17 20h4M20 20v-2"/></svg>Escanear código QR</button>
        <p class="terms">Al iniciar sesión, aceptas nuestros <a href="#">Términos de servicio</a> y nuestra <a href="#">Política de privacidad.</a></p>
      </main>
    </section>
  </div>
  <script>
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailCheck = document.getElementById('emailCheck');
    const submitButton = document.getElementById('submitButton');
    const message = document.getElementById('message');
    let mode = 'login';
    const validEmail = () => /^\S+@\S+\.\S+$/.test(email.value.trim());
    function update() {
      emailCheck.classList.toggle('valid', validEmail());
      submitButton.classList.toggle('ready', validEmail() && password.value.length > 0);
    }
    function showMessage(text, type='info') {
      message.textContent = text;
      message.className = `message ${type}`;
    }
    email.addEventListener('input', update);
    password.addEventListener('input', update);
    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', () => {
      password.type = password.type === 'password' ? 'text' : 'password';
      const showing = password.type === 'text';
      togglePassword.setAttribute('aria-label', showing ? 'Ocultar contraseña' : 'Mostrar contraseña');
      togglePassword.classList.toggle('is-visible', showing);
      togglePassword.classList.remove('eye-animating');
      void togglePassword.offsetWidth;
      togglePassword.classList.add('eye-animating');
    });
    togglePassword.querySelector('svg').addEventListener('animationend', () => togglePassword.classList.remove('eye-animating'));
    function setMode(next) {
      mode = next;
      const login = next === 'login';
      document.getElementById('loginTab').classList.toggle('active', login);
      document.getElementById('registerTab').classList.toggle('active', !login);
      document.getElementById('loginTab').setAttribute('aria-selected', String(login));
      document.getElementById('registerTab').setAttribute('aria-selected', String(!login));
      document.getElementById('heading').textContent = login ? 'Bienvenido de nuevo!' : 'Crea tu cuenta';
      submitButton.textContent = login ? 'Ingresar' : 'Crear cuenta';
      password.autocomplete = login ? 'current-password' : 'new-password';
      showMessage('');
    }
    document.getElementById('loginTab').addEventListener('click', () => setMode('login'));
    document.getElementById('registerTab').addEventListener('click', () => setMode('register'));
    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      if (!validEmail()) return showMessage('Ingresa un correo válido', 'error');
      if (mode === 'register' && password.value.length < 8) return showMessage('La contraseña debe tener al menos 8 caracteres', 'error');
      if (!password.value) return showMessage('Ingresa tu contraseña', 'error');
      showMessage(mode === 'login' ? 'Vista previa: el inicio de sesión no está conectado.' : 'Vista previa: el registro no está conectado.');
    });
    document.getElementById('recover').addEventListener('click', () => {
      showMessage(validEmail() ? 'Vista previa: recuperación de contraseña no conectada.' : 'Ingresa tu correo para recuperar la contraseña.', validEmail() ? 'info' : 'error');
    });
    document.getElementById('qrButton').addEventListener('click', () => showMessage('El inicio con código QR estará disponible pronto.'));
  </script>
</body>
</html>
